<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات المنشأة — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:900px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>بيانات المنشأة</h2>
                <div class="sub">الاسم والعملة وبيانات الفواتير</div>
            </div>
        </div>
        <div class="table-card" style="padding:20px;">
            <div class="form-grid">
                <div class="form-item"><label>اسم المنشأة</label><input id="sCompanyName"></div>
                <div class="form-item"><label>العملة</label><input id="sCurrency"></div>
                <div class="form-item" style="grid-column:1/-1;"><label>العنوان</label><input id="sAddress"></div>
                <div class="form-item"><label>الهاتف</label><input id="sPhone"></div>
                <div class="form-item"><label>الرقم الضريبي</label><input id="sTaxNo"></div>
                <div class="form-item"><label>اختصار العلامة التجارية</label><input id="sBrand"></div>
                <div class="form-item" style="grid-column:1/-1;"><label>ملاحظة تظهر على الفواتير</label><textarea id="sInvoiceNote"></textarea></div>
            </div>
            <div style="margin-top:16px;text-align:left;">
                <button class="btn btn-primary-soft" onclick="saveCompany()"><i class="fa-solid fa-floppy-disk"></i> حفظ البيانات</button>
            </div>
        <div class="table-card" style="padding:20px;margin-top:20px;border-top:3px solid var(--accent-cyan);">
            <h3 style="margin-bottom:12px;font-size:1.1rem;color:var(--accent-cyan);"><i class="fa-solid fa-server"></i> إعدادات الربط مع الباك إند (OpenCode Backend)</h3>
            <div class="sub" style="margin-bottom:16px;">ربط الواجهة بسيرفر الباك إند للعمل في بيئة حقيقية بدلاً من التخزين المحلي</div>
            <div class="form-grid">
                <div class="form-item" style="grid-column:1/-1;">
                    <label>عنوان خادم الباك إند (API Base URL)</label>
                    <div style="display:flex;gap:10px;">
                        <input id="apiBaseUrl" placeholder="http://localhost:5000/api" style="flex:1;">
                        <button class="btn btn-secondary" onclick="testBackendConnection()"><i class="fa-solid fa-plug"></i> اختبار الاتصال</button>
                    </div>
                </div>
            </div>
            <div id="apiTestResult" style="margin-top:12px;display:none;padding:10px 14px;border-radius:8px;font-size:0.9rem;"></div>
        </div>

        <div class="table-card" style="padding:20px;margin-top:20px;border-top:3px solid var(--success);">
            <h3 style="margin-bottom:12px;font-size:1.1rem;color:var(--success);"><i class="fa-solid fa-database"></i> النسخ الاحتياطي واسترجاع البيانات</h3>
            <div class="sub" style="margin-bottom:16px;">تصدير نسخة من كافّة بيانات النظام أو استرجاع بيانات سابقة بسهولة</div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="ARBackup.exportAllData()"><i class="fa-solid fa-download"></i> تصدير نسخة احتياطية (JSON)</button>
                <label class="btn btn-secondary" style="cursor:pointer;margin:0;">
                    <i class="fa-solid fa-upload"></i> استرجاع نسخة احتياطية
                    <input type="file" accept=".json" style="display:none;" onchange="handleRestoreFile(this)">
                </label>
            </div>
        </div>
    </main>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/backup.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        async function handleRestoreFile(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const ok = await UI.confirmBox('هل أنت تأكد من استرجاع البيانات من الملف "' + file.name + '"؟ سيتم تحديث السجلات الحالية.', 'استرجاع النسخة الاحتياطية');
            if (ok) {
                try {
                    await ARBackup.importDataFromFile(file);
                    UI.toast('تم استرجاع النسخة الاحتياطية بنجاح!', 'ok');
                    setTimeout(() => window.location.reload(), 1500);
                } catch(e) {
                    UI.toast('فشل استرجاع الملف: ' + e.message, 'error');
                }
            }
        }
        async function load() {
            const rows = await ARDB.getAll('settings');
            const map = {};
            rows.forEach(r => { if (r && r.key) map[r.key] = r.value; });
            document.getElementById('sCompanyName').value = map.companyName || '';
            document.getElementById('sCurrency').value = map.currency || '';
            document.getElementById('sAddress').value = map.companyAddress || '';
            document.getElementById('sPhone').value = map.companyPhone || '';
            document.getElementById('sTaxNo').value = map.taxNo || '';
            document.getElementById('sBrand').value = map.brandShort || '';
            document.getElementById('sInvoiceNote').value = map.invoiceNote || '';
            
            if (typeof API !== 'undefined') {
                document.getElementById('apiBaseUrl').value = API.getBaseUrl();
            }
        }

        async function testBackendConnection() {
            const urlInput = document.getElementById('apiBaseUrl').value.trim();
            const resBox = document.getElementById('apiTestResult');
            if (typeof API !== 'undefined') {
                API.setBaseUrl(urlInput);
                resBox.style.display = 'block';
                resBox.className = '';
                resBox.style.background = 'rgba(234,179,8,0.1)';
                resBox.style.color = '#eab308';
                resBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري محاولة الاتصال بالسيرفر...';

                const status = await API.checkHealth();
                if (typeof ARUI !== 'undefined') ARUI.updateApiBadge(status);

                if (status.status === 'online') {
                    resBox.style.background = 'rgba(34,197,94,0.15)';
                    resBox.style.color = '#22c55e';
                    resBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> تم الاتصال بالسيرفر بنجاح! يعمل الباك إند على: ' + status.url;
                } else {
                    resBox.style.background = 'rgba(239,68,68,0.15)';
                    resBox.style.color = '#ef4444';
                    resBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> تعذر الاتصال بالسيرفر على: ' + urlInput + ' (النظام يعمل الآن بالوضع المحلي IndexedDB)';
                }
            }
        }

        async function saveCompany() {
            const items = {
                companyName: document.getElementById('sCompanyName').value.trim() || 'AR-Program',
                currency: document.getElementById('sCurrency').value.trim() || 'ج.م',
                companyAddress: document.getElementById('sAddress').value.trim(),
                companyPhone: document.getElementById('sPhone').value.trim(),
                taxNo: document.getElementById('sTaxNo').value.trim(),
                brandShort: document.getElementById('sBrand').value.trim(),
                invoiceNote: document.getElementById('sInvoiceNote').value.trim()
            };
            for (const k of Object.keys(items)) {
                const existing = (await ARDB.getAll('settings')).find(r => r.key === k);
                if (existing) { existing.value = items[k]; await ARDB.put('settings', existing); }
                else await ARDB.add('settings', { key: k, value: items[k] });
            }
            if (typeof API !== 'undefined') {
                const url = document.getElementById('apiBaseUrl').value.trim();
                if (url) API.setBaseUrl(url);
            }
            UI.toast('تم حفظ بيانات المنشأة والإعدادات', 'ok');
        }
        load();
    </script>
</body>
</html>
